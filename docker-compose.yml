services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finmate
      POSTGRES_USER: finmate
      POSTGRES_PASSWORD: finmate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate -d finmate"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - finmate-postgres:/var/lib/postgresql/data

volumes:
  finmate-postgres:
