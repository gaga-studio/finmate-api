name: CI

on:
  pull_request:
  push:
    branches: [main, codex/bootstrap-vnext]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install -r docs/vnext/06-api/requirements.txt
      - name: Validate contracts
        run: python docs/vnext/06-api/verify_contracts.py
      - name: Test
        run: ./gradlew test
