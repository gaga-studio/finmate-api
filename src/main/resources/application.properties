spring.application.name=finmate-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finmate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finmate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finmate}
finmate.app-origin=${FINMATE_APP_ORIGIN:http://localhost:5173}
finmate.jwt-secret=${FINMATE_JWT_SECRET:}
finmate.refresh-cookie-secure=${FINMATE_REFRESH_COOKIE_SECURE:false}
spring.jpa.hibernate.ddl-auto=validate
springdoc.swagger-ui.url=/openapi/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
