services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finmate
      POSTGRES_USER: finmate
      POSTGRES_PASSWORD: finmate-demo
    ports:
      - "127.0.0.1:${FINMATE_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate -d finmate"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - demo-db:/var/lib/postgresql/data
  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finmate
      SPRING_DATASOURCE_USERNAME: finmate
      SPRING_DATASOURCE_PASSWORD: finmate-demo
      FINMATE_JWT_SECRET: local-demo-signing-key-never-use-in-production
      FINMATE_SEED_ON_START: 'true'
      FINMATE_ART_PROVIDER: stub
      FINMATE_APP_ORIGIN: http://localhost:5175
    ports:
      - "127.0.0.1:${FINMATE_API_PORT:-18081}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo-db:
