suite_version: "1.3.0"
title: "FinMate vNext 골든 테스트"
locale: "ko-KR"
clock:
  now: "2026-07-12T12:00:00+09:00"
defaults:
  currency: "KRW"
  timezone: "Asia/Seoul"
  calculation_version: "goal-calc-1.0.0"
  template_version: "goal-template-1.0.0"
  policy_version: "safety-policy-1.0.0"
constants:
  ratio_unit: "BASIS_POINT"
  difficulty_alpha_bps:
    LIGHT: 2500
    STANDARD: 5000
    CHALLENGE: 7500
  minimum_anonymous_group_size: 30
  public_cache_removal_deadline_hours: 24
  baseline_recalibration_threshold_bps: 2000
  long_pause_days: 30
  ai_validation_failure_threshold_bps: 200
  ai_provider_error_threshold_bps: 500

cases:
  - id: "CALC-INCOME-001"
    category: "formula"
    title: "정규소득 중앙값과 여윳돈"
    given:
      income_pattern: "REGULAR"
      completed_month_net_income: [2800000, 3000000, 3200000]
      essential_expense: 1900000
    when:
      action: "CALCULATE_BASELINE"
    expect:
      baseline_income: 3000000
      disposable_income: 1100000
      data_state: "FRESH"
      months_used: 3

  - id: "CALC-LOAN-PRINCIPAL-001"
    category: "formula"
    title: "대출 원금은 수용력 필수지출에 정확히 한 번 포함"
    given:
      baseline_income_krw: 2600000
      completed_months:
        - month: "2026-04"
          essential_expense_transactions:
            - {id: "e-apr", classification: "ESSENTIAL_EXPENSE", direction: "DEBIT", amount_krw: 1280000}
          loan_principal_transactions:
            - {id: "p-apr", classification: "LOAN_PRINCIPAL", direction: "DEBIT", amount_krw: 200000}
        - month: "2026-05"
          essential_expense_transactions:
            - {id: "e-may", classification: "ESSENTIAL_EXPENSE", direction: "DEBIT", amount_krw: 1310000}
          loan_principal_transactions:
            - {id: "p-may", classification: "LOAN_PRINCIPAL", direction: "DEBIT", amount_krw: 200000}
        - month: "2026-06"
          essential_expense_transactions:
            - {id: "e-jun", classification: "ESSENTIAL_EXPENSE", direction: "DEBIT", amount_krw: 1300000}
          loan_principal_transactions:
            - {id: "p-jun", classification: "LOAN_PRINCIPAL", direction: "DEBIT", amount_krw: 200000}
    when:
      action: "CALCULATE_AFFORDABILITY_BASELINE"
    expect:
      monthly_essential_expense_krw: [1480000, 1510000, 1500000]
      baseline_essential_expense_krw: 1500000
      disposable_income_krw: 1100000
      affordability_included_transaction_ids: ["e-apr", "p-apr", "e-may", "p-may", "e-jun", "p-jun"]
      discretionary_spend_excluded_transaction_ids: ["p-apr", "p-may", "p-jun"]
      transaction_double_count: 0

  - id: "CALC-INCOME-002"
    category: "formula"
    title: "불규칙소득은 최근 6개 완료월 중앙값 사용"
    given:
      income_pattern: "IRREGULAR"
      completed_month_net_income: [1200000, 1800000, 2400000, 3000000, 6000000, 9000000]
      essential_expense: 1900000
    when:
      action: "CALCULATE_BASELINE"
    expect:
      baseline_income: 2700000
      disposable_income: 800000
      months_used: 6
      note: "중앙값은 정렬된 세 번째와 네 번째 값의 평균이며 고액 입금이 기준선을 지배하지 않는다."

  - id: "CALC-DISPOSABLE-001"
    category: "formula"
    title: "여윳돈이 0 이하면 행동형 목표만 제공"
    given:
      baseline_income: 1800000
      essential_expense: 1900000
      requested_domain: "SAVING"
    when:
      action: "GENERATE_GOAL_CANDIDATES"
    expect:
      disposable_income: -100000
      quantitative_candidates: []
      action_goal_template_ids:
        - "budget_record_7d"
        - "fixed_cost_review_7d"
        - "support_info_review_7d"
      prohibited_goal_types: ["SAVING_RATE", "SPENDING_RATE", "INVESTMENT_RATE"]

  - id: "CALC-TRANSFER-001"
    category: "classification"
    title: "내부이체·환불·대출·재예치·중복은 성과에서 제외"
    given:
      transactions:
        - {id: "t1", type: "INTERNAL_TRANSFER", amount: 500000}
        - {id: "t2", type: "CARD_REFUND", amount: 80000}
        - {id: "t3", type: "LOAN_DISBURSEMENT", amount: 3000000}
        - {id: "t4", type: "DEPOSIT_REINVESTMENT", amount: 1000000}
        - {id: "t5", type: "SAVING_DEPOSIT", amount: 154000}
        - {id: "t5-copy", duplicate_of: "t5", type: "SAVING_DEPOSIT", amount: 154000}
    when:
      action: "CALCULATE_VERIFIED_SAVING"
    expect:
      verified_saving_amount: 154000
      included_transaction_ids: ["t5"]
      excluded_transaction_ids: ["t1", "t2", "t3", "t4", "t5-copy"]

  - id: "GOAL-INCREASE-001"
    category: "formula"
    title: "저축률 증가형 세 후보"
    given:
      goal_type: "INCREASE"
      baseline_value_bps: 800
      source_value_bps: 2400
      similar_group_percentile_band_bps: [1000, 2000]
      template_safe_range_bps: [500, 2500]
      rounding_step_bps: 100
      minimum_change_bps: 100
    when:
      action: "GENERATE_GOAL_CANDIDATES"
    expect:
      clamped_reference_value_bps: 2000
      candidates:
        - {difficulty: "LIGHT", target_value_bps: 1100}
        - {difficulty: "STANDARD", target_value_bps: 1400}
        - {difficulty: "CHALLENGE", target_value_bps: 1700}
      invariant: "LIGHT < STANDARD < CHALLENGE"

  - id: "GOAL-DECREASE-001"
    category: "formula"
    title: "소비율 감소형 세 후보"
    given:
      goal_type: "DECREASE"
      baseline_value_bps: 8000
      source_value_bps: 5500
      similar_group_percentile_band_bps: [6000, 7500]
      template_safe_range_bps: [5000, 9000]
      rounding_step_bps: 100
      minimum_change_bps: 100
    when:
      action: "GENERATE_GOAL_CANDIDATES"
    expect:
      clamped_reference_value_bps: 6000
      candidates:
        - {difficulty: "LIGHT", target_value_bps: 7500}
        - {difficulty: "STANDARD", target_value_bps: 7000}
        - {difficulty: "CHALLENGE", target_value_bps: 6500}
      invariant: "LIGHT 변화폭 <= STANDARD 변화폭 <= CHALLENGE 변화폭"

  - id: "GOAL-NO-IMPROVEMENT-001"
    category: "formula"
    title: "참고값이 개선 방향이 아니면 정량 후보 폐기"
    given:
      goal_type: "INCREASE"
      baseline_value_bps: 1500
      reference_value_bps: 1200
      template_safe_range_bps: [500, 2500]
    when:
      action: "GENERATE_GOAL_CANDIDATES"
    expect:
      candidates: []
      reason_code: "REFERENCE_NOT_IMPROVEMENT"

  - id: "GOAL-ROUNDING-001"
    category: "formula"
    title: "반올림 후 기준값과 같으면 후보 폐기"
    given:
      goal_type: "INCREASE"
      difficulty: "LIGHT"
      baseline_value_bps: 1000
      reference_value_bps: 1100
      template_safe_range_bps: [500, 2500]
      rounding_step_bps: 100
      minimum_change_bps: 100
    when:
      action: "CALCULATE_SINGLE_CANDIDATE"
    expect:
      raw_target_value_bps: 1025
      rounded_target_value_bps: 1000
      candidate_created: false
      reason_code: "NO_EFFECTIVE_CHANGE"

  - id: "CARD-GROUP-001"
    category: "privacy"
    title: "유사그룹 30명 미만이면 개인 카드 금지"
    given:
      source_user_consent: "GRANTED"
      eligible_group_size: 29
      expanded_non_financial_group_size: 29
      routine_verified_days: 120
    when:
      action: "BUILD_ADVENTURER_CARD"
    expect:
      individual_card_created: false
      fallback_card_kind: "GROUP_ROUTINE"
      group_card_created: false
      recommendation_state: "INSUFFICIENT"
      items: []
      source_profile_key_exposed: false

  - id: "CARD-GROUP-BOUNDARY-001"
    category: "privacy"
    title: "유사그룹이 정확히 30명이면 개인 익명 카드 허용"
    given:
      source_user_consent: "GRANTED"
      eligible_group_size: 30
      routine_verified_days: 120
      data_state: "FRESH"
      routine_percentile_in_allowed_band: true
      reidentification_review: "PASSED"
    when:
      action: "BUILD_ADVENTURER_CARD"
    expect:
      individual_card_created: true
      card_kind: "INDIVIDUAL_ANONYMOUS"
      minimum_group_size_rule_satisfied: true
      source_profile_key_exposed: false

  - id: "CARD-PUBLIC-FIELDS-001"
    category: "privacy"
    title: "익명 카드 응답 허용 필드"
    given:
      eligible_group_size: 45
      source_user_consent: "GRANTED"
      source_record:
        source_profile_key: "src_internal_77"
        exact_income: 3000000
        exact_balance: 12400000
        employer: "서울특별시 소재 A사"
        product_name: "A은행 적금"
        stock_name: "B전자"
        return_rate_bps: 1820
        routine_summary: "월급 다음 날 먼저 저축"
        public_metric_band:
          unit: "BASIS_POINT"
          min_bps: 1500
          max_bps: 2000
        maintained_for_days: 182
    when:
      action: "SERIALIZE_PUBLIC_CARD"
    expect:
      required_public_fields:
        - "cardId"
        - "similarityReasons"
        - "routineSummaries"
        - "publicMetricBand"
        - "maintainedFor"
        - "dataAsOf"
      forbidden_fields:
        - "sourceProfileKey"
        - "exactIncome"
        - "exactBalance"
        - "employer"
        - "productName"
        - "stockName"
        - "returnRate"
        - "returnRateBps"

  - id: "CONSENT-WITHDRAW-001"
    category: "privacy"
    title: "공개 철회 즉시 조회 차단과 24시간 내 파생 제거"
    given:
      consent_state: "GRANTED"
      card_indexed: true
      cached_surfaces: ["compare_api", "home_recommendation", "ai_context"]
      withdrawal_requested_at: "2026-07-12T09:00:00+09:00"
    when:
      action: "WITHDRAW_ANONYMOUS_CARD_SHARE"
    expect:
      consent_state: "WITHDRAWN"
      new_queries_exclude_card_by: "2026-07-12T09:05:00+09:00"
      all_derived_data_removed_by: "2026-07-13T09:00:00+09:00"
      existing_goal_source_link_removed: true
      existing_goal_template_snapshot_retained: true

  - id: "CONSENT-RACE-001"
    category: "privacy"
    title: "철회와 지연 도착한 부여 경합에서 철회 유지"
    given:
      consentAggregateId: "00000000-0000-4000-8000-000000000011"
      persistedState: "ACTIVE"
      persistedVersion: 11
      commandsInReceivedOrder:
        - commandId: "cmd-withdraw-12"
          commandType: "WITHDRAW"
          ifMatch: '"11"'
          expectedVersion: 11
          effectiveAt: "2026-07-12T09:01:00+09:00"
          receivedAt: "2026-07-12T09:01:01+09:00"
        - commandId: "cmd-grant-11-retry"
          commandType: "GRANT"
          ifMatch: '"11"'
          expectedVersion: 11
          effectiveAt: "2026-07-12T09:00:00+09:00"
          receivedAt: "2026-07-12T09:01:02+09:00"
    when:
      action: "APPLY_CONSENT_COMMANDS_WITH_OPTIMISTIC_CONCURRENCY"
      ordering: "WITHDRAWAL_FIRST"
    expect:
      acceptedCommandId: "cmd-withdraw-12"
      acceptedCommandHttpStatus: 200
      consentState: "WITHDRAWN"
      persistedVersion: 12
      staleCommandId: "cmd-grant-11-retry"
      staleCommandRejected: true
      staleCommandHttpStatus: 412
      staleCommandErrorCode: "PRECONDITION_FAILED"
      staleCommandIfMatchVersion: 11
      staleCommandExpectedVersion: 11
      staleCommandActualVersion: 12
      withdrawalFirstSemanticsApplied: true
      terminalStateReactivationForbidden: true
      cardQueryAllowed: false

  - id: "AI-AUDIT-RETENTION-001"
    category: "privacy"
    title: "AI 운영 90일·사고 180일 상한을 경계 시각에 집행"
    given:
      ai_explanation_consent_state: "ACTIVE"
      as_of: "2026-07-12T09:00:00+09:00"
      records:
        - {id: "ai-op-expired", record_class: "OPERATIONAL", created_at: "2026-04-13T09:00:00+09:00", retention_expires_at: "2026-07-12T09:00:00+09:00"}
        - {id: "ai-op-active", record_class: "OPERATIONAL", created_at: "2026-04-14T09:00:00+09:00", retention_expires_at: "2026-07-13T09:00:00+09:00"}
        - {id: "ai-incident-expired", record_class: "INCIDENT_EVIDENCE", created_at: "2026-01-13T09:00:00+09:00", retention_expires_at: "2026-07-12T09:00:00+09:00", incident_id: "inc-180"}
      attempted_record:
        id: "ai-incident-181d"
        record_class: "INCIDENT_EVIDENCE"
        created_at: "2026-01-13T09:00:00+09:00"
        retention_expires_at: "2026-07-13T09:00:00+09:00"
        incident_id: "inc-181"
    when:
      action: "ENFORCE_AI_AUDIT_RETENTION"
    expect:
      operational_max_retention_days: 90
      incident_evidence_max_retention_days: 180
      deleted_record_ids: ["ai-op-expired", "ai-incident-expired"]
      retained_record_ids: ["ai-op-active"]
      attempted_record_accepted: false
      attempted_record_error: "RETENTION_LIMIT_EXCEEDED"

  - id: "AI-CONSENT-WITHDRAW-DELETE-001"
    category: "privacy"
    title: "AI 설명 동의 철회는 비법정 내용과 모든 사용자 연결을 7일 안에 제거"
    given:
      consent_aggregate_id: "00000000-0000-4000-8000-000000000021"
      consent_state: "ACTIVE"
      withdrawal_requested_at: "2026-07-12T09:00:00+09:00"
      pending_ai_request_ids: ["ai-request-pending-01"]
      user_link_ids: ["service-to-ai-user", "ai-user-to-incident", "ai-relink-key"]
      ai_audit_records:
        - {id: "ai-op-unexpired", record_class: "OPERATIONAL", retention_expires_at: "2026-08-01T00:00:00Z"}
        - {id: "ai-incident-unexpired", record_class: "INCIDENT_EVIDENCE", incident_id: "incident-open-02", retention_expires_at: "2026-12-01T00:00:00Z"}
        - id: "ai-legal-preapproved"
          record_class: "LEGAL_REQUIRED"
          legal_basis_citation: "confirmed-basis-02"
          retention_expires_at: "2027-07-12T00:00:00Z"
          record_scope: "ai_incident_minimum"
          approved_by: "privacy-legal-role"
          legal_case_id: "legal_8B"
          legal_approved_at: "2026-07-11T09:00:00+09:00"
    when:
      action: "WITHDRAW_AI_EXPLANATION_CONSENT"
    expect:
      consent_state: "WITHDRAWN"
      new_ai_calls_allowed: false
      pending_ai_requests_cancelled: ["ai-request-pending-01"]
      non_legal_records_deleted_by: "2026-07-19T09:00:00+09:00"
      deleted_record_ids: ["ai-op-unexpired", "ai-incident-unexpired"]
      incident_evidence_survived_without_legal_reclassification: false
      non_legal_ai_user_links_remaining: 0
      relink_keys_remaining: 0
      retained_record_ids: ["ai-legal-preapproved"]
      retained_record_service_user_linked: false
      retained_record_uses_legal_store_case_pseudonym_only: true

  - id: "ACCOUNT-DELETE-001"
    category: "privacy"
    title: "계정 삭제 시 비법정 데이터와 가명 연결 제거"
    given:
      deletion_id: "del_01JZA1"
      requested_at: "2026-07-12T09:00:00+09:00"
      stores:
        - "operational_db"
        - "public_card_index"
        - "analytics_profile"
        - "ai_audit_operational"
      pseudonym_mappings: ["service_to_analytics", "service_to_ai"]
      ai_audit_records:
        - id: "ai-operational-01"
          record_class: "OPERATIONAL"
          retention_expires_at: "2026-08-01T00:00:00Z"
          user_pseudonym: "ai-user-link-01"
        - id: "ai-incident-open-01"
          record_class: "INCIDENT_EVIDENCE"
          incident_id: "incident-open-01"
          retention_expires_at: "2026-12-01T00:00:00Z"
          user_pseudonym: "ai-user-link-02"
        - id: "legal_7A"
          record_class: "LEGAL_REQUIRED"
          legal_basis_citation: "confirmed-basis-01"
          retention_expires_at: "2027-07-12T00:00:00Z"
          record_scope: "consent_audit_minimum"
          approved_by: "privacy-legal-role"
          legal_case_id: "legal_7A"
          legal_approved_at: "2026-07-11T09:00:00+09:00"
    when:
      action: "DELETE_ACCOUNT_DATA"
    expect:
      non_legal_stores_deleted_by: "2026-07-19T09:00:00+09:00"
      operational_ai_text_deleted: true
      incident_evidence_deleted_even_if_unexpired: true
      service_pseudonym_mappings_deleted: true
      relink_key_destroyed: true
      non_legal_ai_user_links_remaining: 0
      retained_record_ids: ["legal_7A"]
      retained_records_isolated: true
      retained_records_use_legal_store_case_pseudonym_only: true
      backup_tombstone_created: true

  - id: "BACKUP-RESTORE-001"
    category: "privacy"
    title: "백업 복원은 삭제 원장 재적용 전 서비스 개방 금지"
    given:
      restore_id: "restore_01JZA2"
      backup_created_at: "2026-07-10T00:00:00Z"
      backup_expires_at: "2026-08-09T00:00:00Z"
      deletion_ledger:
        - {deletion_id: "del_01JZA1", completed_at: "2026-07-12T00:10:00Z", scopes: ["account", "ai_audit", "pseudonym_mapping"]}
      restored_deleted_record_count_before_gate: 4
      restored_pseudonym_mapping_count_before_gate: 2
    when:
      action: "OPEN_SERVICE_AFTER_BACKUP_RESTORE"
    expect:
      deletion_ledger_reapplied: true
      backup_retention_days: 30
      deleted_record_count_after_gate: 0
      pseudonym_mapping_count_after_gate: 0
      service_opened_after_verification: true
      service_opened_before_verification: false

  - id: "DATA-STALE-001"
    category: "state"
    title: "오래된 데이터에서 진행 중지"
    given:
      active_goal_state: "ACTIVE"
      previous_progress_bps: 4200
      data_state: "STALE"
      last_synced_at: "2026-06-01T08:00:00+09:00"
    when:
      action: "REFRESH_GOAL_PROGRESS"
    expect:
      progress_bps: 4200
      progress_updated: false
      raid_state: "WAITING_FOR_DATA"
      last_synced_at_visible: true
      boss_recovery_applied: false

  - id: "BASELINE-CHANGE-001"
    category: "state"
    title: "기준선 2000 bp 변화 시 자동 수정 대신 재확인"
    given:
      active_goal_state: "ACTIVE"
      confirmed_baseline_income: 3000000
      current_baseline_income: 3600000
      current_target_value_bps: 1400
    when:
      action: "REFRESH_BASELINE"
    expect:
      change_bps: 2000
      active_goal_state: "RECALIBRATION_REQUIRED"
      target_value_bps: 1400
      target_automatically_changed: false
      reconfirmation_required: true

  - id: "GOAL-PAUSE-001"
    category: "state"
    title: "30일 초과 일시정지 후 바로 재개 금지"
    given:
      goal_state: "PAUSED"
      paused_at: "2026-06-10T12:00:00+09:00"
      resume_requested_at: "2026-07-12T12:00:00+09:00"
    when:
      action: "RESUME_GOAL"
    expect:
      paused_days: 32
      goal_state: "PAUSED"
      resumed: false
      reason_code: "LONG_PAUSE_RECONFIRMATION_REQUIRED"
      new_candidates_required: true

  - id: "GOAL-IDEMPOTENCY-001"
    category: "contract"
    title: "후보 확정 재시도는 활성 목표 하나만 생성"
    given:
      candidate_id: "cand_standard"
      candidate_state: "VALID"
      idempotency_key: "confirm-20260712-user8-cand-standard"
      request_count: 2
    when:
      action: "CONFIRM_GOAL_CONCURRENTLY"
    expect:
      successful_responses: 2
      created_goal_count: 1
      active_goal_count: 1
      responses_reference_same_goal_id: true

  - id: "QUEST-NO-DOUBLE-COUNT-001"
    category: "integration"
    title: "퀘스트 완료만으로 금융 수치와 레이드가 오르지 않음"
    given:
      quest_kind: "VERIFY_AUTO_SAVING_SETUP"
      quest_state: "STARTED"
      verified_saving_deposit_received: false
      financial_stat_bps: 5200
      goal_progress_bps: 2000
      raid_stage: 1
    when:
      action: "COMPLETE_QUEST"
    expect:
      quest_state: "COMPLETED"
      quest_xp_changed: true
      financial_stat_bps: 5200
      goal_progress_bps: 2000
      raid_stage: 1

  - id: "AI-VALID-001"
    category: "ai_safety"
