catalogVersion: "1.0.0"
calculationVersion: "goal-calc-1.0.0"
effectiveFrom: "2026-07-12T00:00:00+09:00"
defaultTimezone: "Asia/Seoul"
monetaryUnit: "KRW"
ratioUnit: "BASIS_POINT"
candidateExpiresAfter: "P1D"
requiredCalculationEnvelope:
  contractScope: "INTERNAL_CALCULATION_GOLDEN_SCENARIO_PERSISTENCE"
  publicHttpCommonResultWrapper: false
  calculationVersion: "goal-calc-1.0.0"
  dataStateField: "dataState"
  lastSyncedAtField: "lastSyncedAt"
  sourceDataVersionField: "sourceDataVersion"
  calculatedAtField: "calculatedAt"
freshnessPolicy:
  mode: "CONSENT_SCHEDULE_PLUS_GRACE"
  gracePeriod: "P2D"
  maximumSyncInterval: "P30D"
enums:
  dataState:
    - "FRESH"
    - "PENDING"
    - "STALE"
    - "INSUFFICIENT"
    - "NEEDS_REVIEW"
  difficulty:
    - "LIGHT"
    - "STANDARD"
    - "CHALLENGE"
  domain:
    - "SPENDING"
    - "SAVING"
    - "INVESTMENT_JUDGMENT"
    - "FINANCIAL_KNOWLEDGE"
globalExclusions:
  - "INTERNAL_TRANSFER"
  - "REVERSAL"
  - "MATURITY_REINVESTMENT"
  - "BROKERAGE_TRANSFER"
  - "DUPLICATE"
  - "REVIEW_REQUIRED"
affordabilityEssentialExpensePolicy:
  includedDebitClassifications:
    - "ESSENTIAL_EXPENSE"
    - "LOAN_PRINCIPAL"
  loanDisbursementCreditTreatment: "EXCLUDE"
  canonicalTransactionCount: "EXACTLY_ONCE"
discretionarySpendGoalExclusions:
  - "LOAN_PRINCIPAL"
verificationEventContracts:
  APP_AUTO_SAVE_PLAN_RECONFIRM_EVENT:
    schemaVersion: "1.0.0"
    evidenceType: "AUTO_SAVE_PLAN_RECONFIRMED"
    producer: "FINMATE_AUTO_SAVE_SETTING_SCREEN"
    requiredFields:
      - "eventId"
      - "userId"
      - "scheduleIdHash"
      - "scheduledDayOfMonth"
      - "amountKrw"
      - "settingVersion"
      - "confirmedAt"
    validation:
      authenticatedUserMustMatch: true
      amountMustBePositiveIntegerKrw: true
      scheduledDayOfMonthRange:
        min: 1
        max: 31
      settingVersionMustMatchCurrent: true
      deduplicateBy: "eventId"
    financialEffect: "NONE_UNTIL_MYDATA_DEPOSIT_VERIFIED"
templates:
  - templateId: "goal.spending.budget-range.v1"
    version: "1.0.0"
    active: true
    displayName: "예산 범위 유지"
