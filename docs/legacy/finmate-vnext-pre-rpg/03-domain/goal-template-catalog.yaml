    baselinePolicy:
      lookback: "P30D"
      completedPeriodsOnly: false
      timezone: "Asia/Seoul"
      budgetSource: "USER_CONFIRMED_BUDGET"
      expenseScope:
        - "ESSENTIAL_EXPENSE"
        - "DISCRETIONARY_EXPENSE"
      exclusions: "GLOBAL_AND_DISCRETIONARY_SPEND"
    safeBounds:
      budgetUtilizationMinBps: 0
      budgetUtilizationMaxBps: 10000
      minimumDailyBudgetKrw: 1000
      maximumPeriodBudgetKrw: 10000000
    minimumData:
      minimumConnectedAccounts: 1
      minimumVerifiedDays: 7
      allowedDataStates:
        - "FRESH"
    allowedDurations:
      - "P7D"
    verificationSource:
      - "MYDATA_TRANSACTION"
      - "USER_CONFIRMED_BUDGET"
    difficultyPolicy:
      mode: "PREAPPROVED_SET"
      candidates:
        LIGHT:
          duration: "P7D"
          requiredCount: 4
          targetRangeBps:
            min: 0
            max: 10000
        STANDARD:
          duration: "P7D"
          requiredCount: 5
          targetRangeBps:
            min: 0
            max: 10000
        CHALLENGE:
          duration: "P7D"
          requiredCount: 6
          targetRangeBps:
            min: 0
            max: 10000
