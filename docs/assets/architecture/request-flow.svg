<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">조회 결과가 만들어지는 과정</title><desc id="desc">사용자 확인 → 자료 범위 확인 → 원장·월 집계 → 요약·또래 평균. 무거래자는 0원으로 포함합니다. 미적재 기간은 NO_DATA이며 금액은 null입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
<rect x="48" y="47" width="5" height="39" fill="#2563eb"/><text x="72" y="79" font-size="32" font-weight="700">조회 결과가 만들어지는 과정</text>
<rect x="48" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="213" font-size="27" font-weight="700">사용자 확인</text><text x="72" y="254" font-size="19" fill="#475569">로그인한 본인</text><path d="M 286 228 H 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="364" y="213" font-size="27" font-weight="700">자료 범위 확인</text><text x="364" y="254" font-size="19" fill="#475569">완전한 월만 비교</text><path d="M 578 228 H 622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="656" y="213" font-size="27" font-weight="700">원장·월 집계</text><text x="656" y="254" font-size="19" fill="#475569">PostgreSQL</text><path d="M 870 228 H 914" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="924" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="948" y="213" font-size="27" font-weight="700">요약·또래 평균</text><text x="948" y="254" font-size="19" fill="#475569">0원과 자료 없음 구분</text>
<text x="48" y="363" font-size="21" fill="#334155">무거래자는 0원으로 포함합니다. 미적재 기간은 NO_DATA이며 금액은 null입니다.</text>
</g></svg>
