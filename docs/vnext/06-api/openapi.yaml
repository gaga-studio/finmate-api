        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /goals/{goalId}/replacement-candidate-sets:
    post:
      tags:
      - Goals
      operationId: createGoalReplacementCandidateSet
      summary: 일시정지된 목표의 별도 교체 후보 생성
      description: 기존 UserGoal은 PAUSED로 유지하고 replacesGoalId가 있는 별도 후보 세트를 만든다.
      parameters:
      - $ref: '#/components/parameters/GoalId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplacementCandidateSetRequest'
            examples:
              default:
                externalValue: ./examples/goal-replacement-candidate-set-request.json
      responses:
        '201':
          description: 기존 목표와 분리된 교체 후보 세트
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalCandidateSet'
              examples:
                default:
                  externalValue: ./examples/goal-replacement-candidate-set-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /goals/{goalId}/replacement:
    post:
      tags:
      - Goals
      operationId: confirmGoalReplacement
      summary: 교체 후보를 확인해 목표를 원자적으로 교체
      description: 후보 재검증 뒤 기존 목표 CANCELLED/RECALIBRATED와 새 목표 ACTIVE를 한 트랜잭션으로 커밋한다.
      parameters:
      - $ref: '#/components/parameters/GoalId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmGoalReplacementRequest'
            examples:
              default:
                externalValue: ./examples/goal-replacement-request.json
      responses:
        '201':
          description: 원자적으로 교체된 이전 목표와 새 활성 목표
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalReplacementResult'
              examples:
                default:
                  externalValue: ./examples/goal-replacement-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15분 수명의 access token
    RefreshCookie:
      type: apiKey
      in: cookie
      name: finmate_refresh
      description: HttpOnly Secure SameSite=Lax refresh cookie
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 사용자·method·path에서 24시간 유효한 UUID
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 직전 조회에서 받은 강한 ETag
      schema:
        type: string
      example: '"goal-v3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 서버가 발급한 opaque cursor
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    GoalDomainQuery:
      name: domain
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/GoalDomain'
    ContextTagQuery:
      name: contextTag
      in: query
      required: false
      schema:
        type: array
        maxItems: 5
        items:
          type: string
      style: form
      explode: true
    SyncId:
      name: syncId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateSetId:
      name: candidateSetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Animal:
      name: animal
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Animal'
    RecordDate:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 직전 조회에서 받은 ETag. 일치하면 304를 반환한다.
      schema:
        type: string
      example: '"goal-v3"'
  headers:
    RequestId:
      description: 모든 성공·오류·304 응답의 요청 상관관계 ID
      schema:
        type: string
        minLength: 16
    ETag:
      description: resource version을 나타내는 강한 entity tag
      schema:
        type: string
      example: '"goal-v3"'
    PrivacyETag:
      description: 공개 동의 aggregate version을 나타내는 강한 entity tag
      schema:
        type: string
        pattern: ^"privacy-v[0-9]+"$
      example: '"privacy-v7"'
    Location:
      description: 생성되거나 접수된 resource URL
      schema:
        type: string
        format: uri-reference
    RefreshCookie:
      description: 회전된 HttpOnly refresh cookie
      schema:
        type: string
      example: finmate_refresh=opaque-token; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
    IdempotencyReplayed:
      description: 저장된 최초 응답을 재생했는지 여부
      schema:
        type: boolean
      example: false
    DataState:
      description: body의 필수 dataFreshness.state와 반드시 같은 값
      schema:
        $ref: '#/components/schemas/DataState'
  responses:
    GoalPaused:
      description: PAUSED로 변경된 목표
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        X-Data-State:
          $ref: '#/components/headers/DataState'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PauseGoalResponse'
          examples:
            paused:
              externalValue: ./examples/goal-paused-response.json
    GoalResumed:
      description: ACTIVE로 재개된 목표
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        X-Data-State:
          $ref: '#/components/headers/DataState'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResumeGoalResponse'
          examples:
            active:
              externalValue: ./examples/goal-resumed-response.json
    GoalCancelled:
      description: CANCELLED로 변경된 목표
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        X-Data-State:
          $ref: '#/components/headers/DataState'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CancelGoalResponse'
          examples:
            cancelled:
              externalValue: ./examples/goal-cancelled-response.json
    QuestChanged:
      description: 변경된 퀘스트
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Data-State:
          $ref: '#/components/headers/DataState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Quest'
          examples:
            started:
              externalValue: ./examples/quest-response.json
    QuestCancelled:
      description: 사용자 사유와 함께 CANCELLED로 종결된 퀘스트
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Data-State:
          $ref: '#/components/headers/DataState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CancelQuestResponse'
          examples:
            cancelled:
              externalValue: ./examples/quest-cancelled-response.json
    BadRequest:
      description: 요청 형식 또는 field validation 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              externalValue: ./examples/problem-validation.json
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Unauthorized:
      description: 인증 필요 또는 token 무효
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Forbidden:
      description: 권한 또는 유효 동의 부족
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    NotFound:
      description: 자원이 없거나 현재 사용자에게 보이지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Conflict:
      description: 현재 상태, 멱등성 키 또는 데이터 신선도와 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    PreconditionFailed:
      description: If-Match와 최신 resource version 불일치
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    UnprocessableEntity:
      description: 요청 형식은 맞지만 도메인 규칙상 처리할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    RateLimited:
      description: 요청 한도 초과
      headers:
        Retry-After:
          schema:
            type: integer
          description: 재시도까지 남은 초
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 예상하지 못한 서버 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    ServiceUnavailable:
      description: 필수 의존 서비스의 일시 장애
      headers:
        Retry-After:
          schema:
            type: integer
          description: 재시도까지 남은 초
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: 표현이 변경되지 않음
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Data-State:
          $ref: '#/components/headers/DataState'
  schemas:
    SignUpRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        displayName:
          type: string
          minLength: 1
          maxLength: 30
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresAt
      - user
      properties:
        accessToken:
          type: string
          minLength: 20
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      additionalProperties: false
      required:
      - userId
      - email
      - displayName
      - onboardingStatus
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        onboardingStatus:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
    MeResponse:
      type: object
      additionalProperties: false
      required:
      - user
      - onboarding
      - preferences
      - privacy
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        onboarding:
          oneOf:
          - $ref: '#/components/schemas/OnboardingProfile'
          - $ref: '#/components/schemas/NullValue'
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        privacy:
          $ref: '#/components/schemas/PrivacySettings'
    OnboardingRequest:
      allOf:
      - $ref: '#/components/schemas/OnboardingProfile'
    OnboardingProfile:
      type: object
      additionalProperties: false
      required:
      - housingType
      - employmentType
      - incomeRegularity
      - hasDependents
      - primaryConcern
      - changePace
      - riskTolerance
      - notificationPreference
      - contextTags
      - profileConsentVersion
      properties:
        housingType:
          type: string
          enum:
          - WITH_FAMILY
          - MONTHLY_RENT
          - JEONSE
          - OWN
          - OTHER
        employmentType:
          type: string
          enum:
          - EMPLOYEE
          - SELF_EMPLOYED
          - PART_TIME
          - STUDENT
          - UNEMPLOYED
          - OTHER
        incomeRegularity:
          type: string
          enum:
          - REGULAR
          - IRREGULAR
          - NONE
        hasDependents:
          type: boolean
        primaryConcern:
          $ref: '#/components/schemas/GoalDomain'
        changePace:
          type: string
          enum:
          - GENTLE
          - BALANCED
          - AMBITIOUS
        riskTolerance:
          type: string
          enum:
          - CONSERVATIVE
          - MODERATE
          - AGGRESSIVE
          - NOT_ASSESSED
        notificationPreference:
          type: string
          enum:
          - IMPORTANT_ONLY
          - DAILY_SUMMARY
          - NONE
        contextTags:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
        profileConsentVersion:
          type: string
          pattern: ^profile-consent-v[0-9]+\.[0-9]+$
    UserPreferences:
      type: object
      additionalProperties: false
      required:
      - raidMotion
      - pushEnabled
      - locale
      - timeZone
      properties:
        raidMotion:
          type: string
          enum:
          - FULL
          - REDUCED
          - 'OFF'
        pushEnabled:
          type: boolean
        locale:
          type: string
          enum:
          - ko-KR
        timeZone:
          type: string
          enum:
          - Asia/Seoul
    PrivacySettings:
      type: object
      additionalProperties: false
      required:
      - consentAggregateId
      - anonymousCardOptIn
      - exposedFields
      - consentVersion
      - version
      - updatedAt
      - shareConsentState
      properties:
        consentAggregateId:
          type: string
          format: uuid
          description: 공개 동의 이벤트를 순서화하는 aggregate 식별자
        anonymousCardOptIn:
          type: boolean
        exposedFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - CONTEXT_TAGS
            - ROUTINE_SUMMARY
            - PUBLIC_METRIC_BAND
            - MAINTAINED_PERIOD
        consentVersion:
          type: string
          pattern: ^privacy-v[0-9]+\.[0-9]+$
        version:
          type: integer
          minimum: 1
          description: 성공한 변경마다 증가하며 응답 ETag와 같은 aggregate version을 나타낸다.
        updatedAt:
          type: string
          format: date-time
        shareConsentState:
          type: string
          enum:
          - OPTED_OUT
          - ACTIVE
          - UNDER_REVIEW
          - WITHDRAWN
      oneOf:
      - title: Publication disabled
        properties:
          anonymousCardOptIn:
            enum:
            - false
          exposedFields:
            maxItems: 0
          shareConsentState:
            enum:
            - OPTED_OUT
            - WITHDRAWN
      - title: Publication enabled or under safety review
        properties:
          anonymousCardOptIn:
            enum:
            - true
          exposedFields:
            minItems: 1
          shareConsentState:
            enum:
            - ACTIVE
            - UNDER_REVIEW
    CreateMyDataConnectionRequest:
      type: object
      additionalProperties: false
      required:
      - provider
      - scopes
      - consentVersion
      properties:
        provider:
          type: string
          enum:
          - SYNTHETIC
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - ACCOUNTS
            - TRANSACTIONS
            - CARDS
            - INVESTMENTS
        consentVersion:
          type: string
          pattern: ^mydata-v[0-9]+\.[0-9]+$
    MyDataConnectionResponse:
      type: object
      additionalProperties: false
      required:
      - connection
      - latestSyncJob
      - dataFreshness
      properties:
        connection:
          oneOf:
          - $ref: '#/components/schemas/MyDataConnection'
          - $ref: '#/components/schemas/NullValue'
        latestSyncJob:
          description: 가장 최근 실행이다. 종결된 실행도 조회 가능하며 아직 실행이 없으면 null이다. 연결 또는 scheduler readiness를 IDLE 실행으로 합성하지 않는다.
          oneOf:
          - $ref: '#/components/schemas/SyncJob'
          - $ref: '#/components/schemas/NullValue'
        dataFreshness:
          $ref: '#/components/schemas/DataFreshness'
    MyDataConnection:
      type: object
      additionalProperties: false
      required:
      - connectionId
      - provider
      - status
      - scopes
      - consentVersion
      - connectedAt
      - withdrawnAt
      properties:
        connectionId:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - SYNTHETIC
        status:
          type: string
          description: 연결 자체의 실행 가능성만 나타낸다. scheduler readiness와 개별 sync run의 수명주기 상태는 각각 분리된다.
          enum:
          - CONNECTED
          - ACTION_REQUIRED
          - WITHDRAWN
        scopes:
          type: array
          items:
            type: string
            enum:
            - ACCOUNTS
            - TRANSACTIONS
            - CARDS
            - INVESTMENTS
        consentVersion:
          type: string
        connectedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
    SyncJob:
      type: object
      additionalProperties: false
      description: 한 번 생성된 sync run의 상태와 결과다. IDLE은 run이 아니며 readiness는 connection/scheduler에서 별도로 관리한다. 종결 상태도 이 resource로 계속 조회할 수 있다.
      required:
      - syncId
      - connectionId
      - status
      - requestedAt
      - pollAfterSeconds
      - dataFreshness
      properties:
        syncId:
          type: string
          format: uuid
        connectionId:
          type: string
          format: uuid
        status:
          type: string
          description: 생성된 실행만 표현하며 SUCCEEDED, PARTIAL_FAILED, FAILED, BLOCKED는 조회 가능한 종결 상태다.
          enum:
          - REQUESTED
          - FETCHING
          - NORMALIZING
          - RECONCILING
          - SUCCEEDED
          - PARTIAL_FAILED
