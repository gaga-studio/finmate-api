    GoalCandidateRecommendation:
      type: object
      additionalProperties: false
      description: candidates의 코드 소유 값은 반복하지 않고 허용된 candidateId 하나와 설명만 제공한다. 숫자와 기간은 candidates에서만 렌더링한다.
      required:
      - recommendedCandidateId
      - reasonCodes
      - summary
      - riskNotice
      - recommendationState
      properties:
        recommendedCandidateId:
          type: string
          format: uuid
          description: 같은 candidate set의 candidates[].candidateId 중 하나여야 한다.
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - PACE_MATCH
            - LOW_CHANGE
            - HIGH_CHANGE
            - WITHIN_SAFE_RANGE
            - ROUTINE_MAINTAINED
            - DATA_LIMITATION
            - INCOME_REGULARITY_MATCH
            - HOUSING_COST_BAND_MATCH
        summary:
          type: string
          minLength: 1
          maxLength: 240
          pattern: '^[^0-9]*$'
          description: 승인된 근거 설명만 포함하며 후보의 숫자나 기간을 반복하지 않는다.
        riskNotice:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[^0-9]*$'
          description: 선택권과 데이터 한계를 설명하며 숫자를 새로 만들지 않는다.
        recommendationState:
          type: string
          enum:
          - AI_GENERATED
          - DETERMINISTIC_FALLBACK
