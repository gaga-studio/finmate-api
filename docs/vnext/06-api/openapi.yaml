      - PENDING
      - STALE
      - INSUFFICIENT
      - NEEDS_REVIEW
    DataFreshness:
      type: object
      additionalProperties: false
      required:
      - state
      - asOf
      - lastSyncedAt
      - calculatedAt
      - staleAfter
      - calculationVersion
      - sourceDataVersion
      - reasonCode
      - blockedOperations
      properties:
        state:
          $ref: '#/components/schemas/DataState'
        asOf:
          type: string
          format: date-time
          nullable: true
          description: 계산 원천 기준 시각. 최초 sync 전 또는 금융 원천을 쓰지 않는 앱 이벤트 전용 응답에서만 null.
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: 필수 범위가 모두 SUCCEEDED인 마지막 완전 동기화 기준 시각. 최초 완전 성공 전 또는 앱 이벤트 전용 응답에서만 null.
        calculatedAt:
          type: string
          format: date-time
        staleAfter:
          type: string
          format: date-time
          nullable: true
        calculationVersion:
          type: string
          minLength: 1
        sourceDataVersion:
          type: string
          minLength: 1
        reasonCode:
          type: string
          nullable: true
          enum:
          - null
          - SYNC_IN_PROGRESS
          - PARTIAL_SYNC
          - PROVIDER_DELAY
          - BASELINE_TOO_SHORT
          - CLASSIFICATION_CONFLICT
          - OUTLIER_DETECTED
          - CONSENT_WITHDRAWN
          - SAFE_COHORT_TOO_SMALL
        blockedOperations:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - CREATE_QUANTITATIVE_CANDIDATES
            - CONFIRM_QUANTITATIVE_GOAL
            - UPDATE_GOAL_PROGRESS
            - VERIFY_MYDATA_QUEST
            - READ_RECOMMENDATIONS
        lastPartialSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: 부분 커밋이 한 번도 없을 때만 null. lastSyncedAt을 대신하지 않는다.
