openapi: 3.0.3
info:
  title: FinMate vNext API
  version: 1.0.0
  description: "FinMate vNext MVP의 공개 HTTP 계약이다. 추천 모험가의 검증된 루틴을\n사용자 기준선에 맞는 목표로 변환하고, 목표·자동 레이드·퀘스트·기록을 제공한다.\n금융 수치와 후보 허용 목록은\
    \ 결정론적 코드가 만들고, AI는 허용 후보 안에서 순위를 정해 근거를 설명한다. AI가 실패하거나 검증을 통과하지 못하면 결정론적 fallback이 같은 응답 계약을 제공한다.\n MVP MyData는 SYNTHETIC 어댑터만 사용하며 모든 동작은 결정적 계약으로 완성한다."
  contact:
    name: FinMate API Team
  license:
    name: Proprietary
x-finmate-contract-codes:
  errorCodes:
  - ACTIVE_GOAL_EXISTS
  - AUTH_REQUIRED
  - AUTH_TOKEN_INVALID
  - BUSINESS_RULE_VIOLATION
  - CANDIDATE_EXPIRED
  - CONSENT_REQUIRED
  - DATA_INSUFFICIENT
  - DATA_STALE
  - DEPENDENCY_UNAVAILABLE
  - FORBIDDEN
  - IDEMPOTENCY_CONFLICT
  - INTERNAL_ERROR
  - INVALID_CURSOR
  - MALFORMED_REQUEST
  - NUMERIC_OVERFLOW
  - PRECONDITION_FAILED
  - RATE_LIMITED
  - RECALIBRATION_REQUIRED
  - RESOURCE_NOT_FOUND
  - VALIDATION_FAILED
  idempotencyConflictCode: IDEMPOTENCY_CONFLICT
  recalibrationConflictCode: RECALIBRATION_REQUIRED
  recalibrationReasons:
  - BASELINE_CHANGED_2000_BPS_OR_MORE
  - TEMPLATE_INACTIVE
  - REQUIRED_CONSENT_CHANGED
  - PAUSE_EXCEEDED_P30D
servers:
- url: http://localhost:8080/api/v1
  description: 로컬 개발
- url: https://api.finmate.kr/api/v1
  description: 운영
tags:
- name: Auth
  description: 가입과 회전형 세션
- name: Me
  description: 내 프로필, 온보딩, 환경설정
- name: MyData
  description: 마이데이터 연결과 비동기 동기화
- name: Home
  description: 목표와 자동 레이드 홈
- name: Adventurers
  description: 공개 동의를 통과한 익명 추천 모험가
- name: Goals
  description: 목표 후보와 목표 생명주기
- name: Quests
  description: 목표 연결 행동과 검증 상태
- name: Reports
  description: 네 동물 금융 리포트
- name: Records
  description: 30일 여정과 일일 기록
security:
- bearerAuth: []
paths:
  /auth/signup:
    post:
      tags:
      - Auth
      operationId: signUp
      summary: 이메일 계정 생성
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              default:
                externalValue: ./examples/auth-signup-request.json
      responses:
        '201':
          description: 계정과 세션 생성
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  externalValue: ./examples/auth-session-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 같은 Idempotency-Key 재요청은 최초의 201 상태, 헤더, 본문을 그대로 반환한다.
  /auth/login:
    post:
      tags:
      - Auth
      operationId: logIn
      summary: 이메일 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                externalValue: ./examples/auth-login-request.json
      responses:
        '200':
          description: 인증된 세션
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  externalValue: ./examples/auth-session-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshSession
      summary: refresh cookie로 세션 회전
      description: HttpOnly refresh cookie를 회전하고 새 access token을 반환한다.
      security:
      - RefreshCookie: []
      responses:
        '200':
          description: 회전된 세션
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
            Cache-Control:
              schema:
                type: string
              example: no-store
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  externalValue: ./examples/auth-session-response.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logOut
      summary: 현재 refresh session 폐기
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            Set-Cookie:
              schema:
                type: string
              example: finmate_refresh=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Lax
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        RefreshCookie: []
  /me:
    get:
      tags:
      - Me
      operationId: getMe
      summary: 내 계정과 온보딩 상태 조회
      responses:
        '200':
          description: 내 계정
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              examples:
                default:
                  externalValue: ./examples/me-response.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/onboarding:
    put:
      tags:
      - Me
      operationId: saveOnboarding
      summary: 온보딩 응답과 동의 저장
      description: 전체 온보딩 문서를 교체하는 멱등 PUT이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
            examples:
              default:
                externalValue: ./examples/onboarding-request.json
      responses:
        '200':
          description: 저장된 내 계정
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              examples:
                default:
                  externalValue: ./examples/me-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/preferences:
    put:
      tags:
      - Me
      operationId: savePreferences
      summary: 접근성·알림 환경설정 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: 저장된 환경설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
              examples:
                default:
                  externalValue: ./examples/preferences-response.json
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/privacy:
    put:
      tags:
      - Me
      operationId: savePrivacySettings
      summary: 익명 카드 공개 설정 저장 또는 철회
      description: 공개를 끄면 추천 조회에서 즉시 제외하고 파생 투영을 24시간 이내 제거한다. Idempotency-Key는 재시도를, If-Match와 expectedVersion은 consent aggregate의 순서를 보호하므로 지연된 opt-in이 이후 철회를 덮어쓸 수 없다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePrivacySettingsRequest'
            examples:
              withdrawal:
                externalValue: ./examples/privacy-settings-request.json
              staleDelayedOptIn:
                externalValue: ./examples/privacy-settings-stale-opt-in-request.json
      responses:
        '200':
          description: 저장된 공개 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
              examples:
                withdrawn:
                  externalValue: ./examples/privacy-settings-response.json
          headers:
            ETag:
              $ref: '#/components/headers/PrivacyETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: If-Match 또는 expectedVersion이 최신 공개 동의 aggregate version과 불일치해 변경을 적용하지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                staleDelayedOptIn:
                  externalValue: ./examples/privacy-settings-stale-conflict.json
          headers:
            ETag:
              $ref: '#/components/headers/PrivacyETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /mydata/connection:
    get:
      tags:
      - MyData
      operationId: getMyDataConnection
      summary: 현재 마이데이터 연결 조회
      responses:
        '200':
          description: 현재 연결. 연결 전이면 connection이 null이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDataConnectionResponse'
              examples:
                default:
                  externalValue: ./examples/mydata-connection-response.json
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - MyData
      operationId: createMyDataConnection
      summary: 마이데이터 연결과 동의 생성
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMyDataConnectionRequest'
      responses:
        '201':
          description: 생성된 연결
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMyDataConnectionResponse'
              examples:
                default:
                  externalValue: ./examples/mydata-connection-created-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - MyData
      operationId: revokeMyDataConnection
      summary: 마이데이터 연결 동의를 WITHDRAWN으로 철회
      description: 새 수집을 즉시 중단한다. 개인 기록 보존·삭제는 동의 정책을 따른다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: 철회된 연결과 마지막 완전 동기화 신선도
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDataConnectionResponse'
              examples:
                withdrawn:
                  externalValue: ./examples/mydata-connection-withdrawn-response.json
  /mydata/syncs:
    post:
      tags:
      - MyData
      operationId: requestMyDataSync
      summary: 비동기 동기화 요청
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 동기화 접수
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              schema:
                type: integer
              example: 5
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
              examples:
                default:
                  externalValue: ./examples/sync-accepted-response.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /mydata/syncs/{syncId}:
    get:
      tags:
      - MyData
      operationId: getMyDataSync
      summary: 동기화 작업 상태 조회
      parameters:
      - $ref: '#/components/parameters/SyncId'
      responses:
        '200':
          description: 동기화 작업
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
              examples:
                requested:
                  externalValue: ./examples/sync-accepted-response.json
                succeeded:
                  externalValue: ./examples/sync-succeeded-response.json
                partial:
                  externalValue: ./examples/sync-partial-response.json
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /baseline:
    get:
      tags:
      - MyData
      operationId: getFinancialBaseline
      summary: 목표 계산에 사용하는 내 금융 기준선 조회
      responses:
        '200':
          description: 정량 목표 준비 여부와 계산 계보를 포함한 기준선
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-State:
              $ref: '#/components/headers/DataState'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialBaseline'
              examples:
                stale:
                  externalValue: ./examples/baseline-response.json
                insufficient:
                  externalValue: ./examples/baseline-insufficient-response.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /transactions/reviews:
    get:
      tags:
      - MyData
      operationId: listTransactionReviews
      summary: 목표 계산에서 제외된 확인 필요 거래 조회
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 확인 필요 거래 목록
          headers:
            X-Data-State:
              $ref: '#/components/headers/DataState'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReviewPage'
              examples:
                default:
                  externalValue: ./examples/transaction-review-list-response.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /transactions/{transactionId}/classification:
    put:
      tags:
      - MyData
      operationId: classifyTransaction
      summary: 내 거래 분류를 확인 또는 수정
      description: 원천 거래는 변경하지 않고 사용자 분류 결정 이력을 추가한다.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyTransactionRequest'
            examples:
              default:
                externalValue: ./examples/classify-transaction-request.json
      responses:
        '200':
          description: 반영된 사용자 분류 결정
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Data-State:
              $ref: '#/components/headers/DataState'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionClassificationResult'
              examples:
                default:
                  externalValue: ./examples/transaction-review-response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /home:
    get:
      tags:
      - Home
      operationId: getHome
      summary: 목표와 자동 레이드 홈 조회
      responses:
        '200':
          description: 홈 상태
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-State:
              $ref: '#/components/headers/DataState'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
              examples:
                insufficient:
                  externalValue: ./examples/home-no-goal-response.json
                stale:
                  externalValue: ./examples/home-active-response.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '304':
          $ref: '#/components/responses/NotModified'
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
  /adventurers:
    get:
      tags:
      - Adventurers
      operationId: listAdventurers
      summary: 추천 모험가 목록 조회
      parameters:
      - $ref: '#/components/parameters/GoalDomainQuery'
